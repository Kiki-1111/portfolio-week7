<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanics Phenomena Visualized</title>
  <meta name="description" content="An interactive N-body gravity sandbox for the physics classroom." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04060c;
      --panel: rgba(9, 15, 25, 0.84);
      --line: rgba(92, 214, 255, 0.16);
      --line-soft: rgba(92, 214, 255, 0.09);
      --cyan: #5ce1ff;
      --warm: #ff6b4a;
      --text: #dbe7f3;
      --muted: #7d90a6;
      --sans: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Title bar ===== */
    .topbar {
      position: relative;
      z-index: 3;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 64px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(12, 20, 32, 0.96), rgba(5, 9, 16, 0.92));
    }
    .topbar::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0.6;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan), 0 0 28px rgba(92, 225, 255, 0.45);
      animation: pulse 2.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.82); }
    }
    .topbar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .topbar-tag {
      margin-left: auto;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ===== Stage & canvas ===== */
    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      padding: 14px 16px 16px;
    }
    #sky {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(92, 214, 255, 0.14);
      border-radius: 18px;
      background: #000;
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.9), 0 0 70px rgba(40, 120, 160, 0.10);
      cursor: crosshair;
      touch-action: none;
    }

    /* ===== Control panel ===== */
    .panel {
      position: absolute;
      top: 30px;
      left: 32px;
      z-index: 2;
      width: 254px;
      max-height: calc(100% - 60px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line-soft);
    }
    .panel-head > :first-child {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .panel-badge {
      padding: 2px 6px;
      border: 1px solid rgba(255, 107, 74, 0.35);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--warm);
    }

    .ctrl { margin-bottom: 12px; }
    .ctrl label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .ctrl output {
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: 0.02em;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      margin: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(92, 225, 255, 0.55), rgba(92, 225, 255, 0.12));
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border: none;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px rgba(92, 225, 255, 0.85), 0 0 2px #fff;
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: none;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px rgba(92, 225, 255, 0.85);
    }
    input[type="range"]:focus-visible {
      outline: 1px solid rgba(92, 225, 255, 0.5);
      outline-offset: 4px;
    }

    .switches {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 14px 0 13px;
      padding-top: 11px;
      border-top: 1px solid var(--line-soft);
    }
    .switch {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .track {
      position: relative;
      flex: 0 0 auto;
      width: 30px;
      height: 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #8090a4;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .switch input:checked + .track {
      background: rgba(92, 225, 255, 0.32);
      box-shadow: 0 0 12px rgba(92, 225, 255, 0.22);
    }
    .switch input:checked + .track::after {
      transform: translateX(14px);
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }
    .switch input:focus-visible + .track {
      outline: 1px solid rgba(92, 225, 255, 0.6);
      outline-offset: 3px;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btns button {
      padding: 8px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(92, 225, 255, 0.07);
      color: var(--text);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.16s, border-color 0.16s, box-shadow 0.16s, color 0.16s;
    }
    .btns button:hover {
      border-color: rgba(92, 225, 255, 0.45);
      background: rgba(92, 225, 255, 0.16);
      color: #fff;
      box-shadow: 0 0 18px rgba(92, 225, 255, 0.18);
    }
    .btns button:active { transform: translateY(1px); }
    .btns button.is-on {
      border-color: rgba(255, 107, 74, 0.5);
      background: rgba(255, 107, 74, 0.13);
      color: #ffb3a1;
    }

    /* ===== HUD ===== */
    .counter {
      position: absolute;
      top: 30px;
      right: 34px;
      z-index: 2;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(8, 14, 24, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
    }
    .counter b {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(92, 225, 255, 0.45);
    }

    .hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      z-index: 2;
      transform: translateX(-50%);
      margin: 0;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(6, 10, 18, 0.68);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.05em;
      color: var(--muted);
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .topbar { height: 56px; padding: 0 14px; }
      .topbar h1 { font-size: 11.5px; letter-spacing: 0.1em; }
      .topbar-tag { display: none; }
      .stage { padding: 10px 10px 12px; }
      .panel {
        top: 16px;
        left: 16px;
        width: 190px;
        max-height: calc(100% - 96px);
        padding: 10px;
        border-radius: 12px;
      }
      .panel-head { margin-bottom: 10px; }
      .ctrl label { font-size: 8.5px; letter-spacing: 0.05em; }
      .switch { font-size: 10px; }
      .btns button { font-size: 8.5px; padding: 7px 4px; }
      .counter { top: 16px; right: 16px; padding: 6px 11px; font-size: 8.5px; }
      .counter b { font-size: 13px; }
      .hint {
        bottom: 14px;
        max-width: calc(100% - 28px);
        font-size: 8.5px;
        letter-spacing: 0.02em;
        line-height: 1.5;
        text-align: center;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand-dot" aria-hidden="true"></span>
    <h1>Mechanics Phenomena Visualized</h1>
    <span class="topbar-tag">N-BODY SIMULATION</span>
  </header>

  <main class="stage" id="stage">
    <canvas id="sky" aria-label="Interactive gravity simulation. Drag to launch a body."></canvas>

    <aside class="panel" aria-label="Simulation controls">
      <div class="panel-head">
        <span>Controls</span>
        <span class="panel-badge">Live</span>
      </div>

      <div class="ctrl">
        <label for="gRange">Gravity strength <output id="gVal" for="gRange">1.00&times;</output></label>
        <input id="gRange" type="range" min="0" max="2.5" step="0.05" value="1" />
      </div>

      <div class="ctrl">
        <label for="expRange">Universe expansion <output id="expVal" for="expRange">0.00&times;</output></label>
        <input id="expRange" type="range" min="0" max="100" step="1" value="0" />
      </div>

      <div class="ctrl">
        <label for="massRange">New body mass <output id="massVal" for="massRange">50</output></label>
        <input id="massRange" type="range" min="5" max="300" step="1" value="50" />
      </div>

      <div class="switches">
        <label class="switch">
          <input type="checkbox" id="trailsChk" checked />
          <span class="track" aria-hidden="true"></span>
          <span>Motion trails</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="mergeChk" checked />
          <span class="track" aria-hidden="true"></span>
          <span>Merge on collision</span>
        </label>
      </div>

      <div class="btns">
        <button type="button" id="pauseBtn">Pause</button>
        <button type="button" id="clearBtn">Clear</button>
        <button type="button" id="galaxyBtn">Galaxy</button>
        <button type="button" id="binaryBtn">Binary</button>
      </div>
    </aside>

    <div class="counter"><b id="count">0</b><span>bodies</span></div>

    <p class="hint">Drag to launch a body &mdash; Click to place at rest &mdash; sliders tune G &amp; expansion</p>
  </main>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("sky");
      var ctx = canvas.getContext("2d");
      var countEl = document.getElementById("count");

      var TAU = Math.PI * 2;
      var G_BASE = 1.8;
      var MAX_BODIES = 420;
      var LAUNCH_POWER = 0.085;
      var MAX_LAUNCH = 26;

      var state = {
        paused: false,
        trails: true,
        merge: true,
        G: 1,
        expansion: 0,
        newMass: 50
      };

      var W = 1;
      var H = 1;
      var bodies = [];
      var drag = null;

      /* ---------- Body helpers ---------- */

      function radiusFor(m) {
        return Math.max(1.6, 2.2 * Math.cbrt(Math.max(0.05, m)));
      }

      // Lighter bodies are bluish-white, heavier ones burn reddish
      function colorFor(m) {
        var t = Math.min(1, Math.max(0, (m - 8) / 320));
        return [
          Math.round(198 + 57 * t),
          Math.round(226 - 148 * t),
          Math.round(255 - 205 * t)
        ];
      }

      function rgba(c, a) {
        return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
      }

      function darker(c, f) {
        return "rgb(" + Math.round(c[0] * f) + "," + Math.round(c[1] * f) + "," + Math.round(c[2] * f) + ")";
      }

      function addBody(x, y, vx, vy, m) {
        var b = { x: x, y: y, vx: vx, vy: vy, m: m, r: radiusFor(m), ax: 0, ay: 0 };
        bodies.push(b);
        return b;
      }

      /* ---------- Canvas sizing ---------- */

      function resize() {
        var cw = canvas.clientWidth || 1;
        var ch = canvas.clientHeight || 1;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        if (bodies.length && W > 1 && H > 1) {
          var sx = cw / W;
          var sy = ch / H;
          for (var i = 0; i < bodies.length; i++) {
            bodies[i].x *= sx;
            bodies[i].y *= sy;
          }
        }

        W = cw;
        H = ch;
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      /* ---------- Physics ---------- */

      function integrate(h) {
        var n = bodies.length;
        var G = G_BASE * state.G;
        var i, j, a, b;

        for (i = 0; i < n; i++) {
          bodies[i].ax = 0;
          bodies[i].ay = 0;
        }

        for (i = 0; i < n; i++) {
          a = bodies[i];
          for (j = i + 1; j < n; j++) {
            b = bodies[j];
            var dx = b.x - a.x;
            var dy = b.y - a.y;
            var d2 = dx * dx + dy * dy;

            // Soften close encounters so the integrator stays calm
            var soft = Math.max(6, (a.r + b.r) * 0.6);
            if (d2 < soft * soft) d2 = soft * soft;

            var invD = 1 / Math.sqrt(d2);
            var f = G * invD * invD * invD;

            a.ax += dx * f * b.m;
            a.ay += dy * f * b.m;
            b.ax -= dx * f * a.m;
            b.ay -= dy * f * a.m;
          }
        }

        for (i = 0; i < n; i++) {
          b = bodies[i];
          b.vx += b.ax * h;
          b.vy += b.ay * h;
          b.x += b.vx * h;
          b.y += b.vy * h;
        }
      }

      function collide() {
        for (var i = 0; i < bodies.length; i++) {
          var a = bodies[i];
          for (var j = i + 1; j < bodies.length; j++) {
            var b = bodies[j];
            var dx = b.x - a.x;
            var dy = b.y - a.y;
            var min = a.r + b.r;
            var d2 = dx * dx + dy * dy;
            if (d2 > min * min) continue;

            var d = Math.sqrt(d2);
            if (d < 0.001) { dx = 0.7; dy = 0; d = 0.7; }
            var nx = dx / d;
            var ny = dy / d;

            if (state.merge) {
              // Merge in the heavier direction: conserve mass and momentum
              var total = a.m + b.m;
              a.x = (a.x * a.m + b.x * b.m) / total;
              a.y = (a.y * a.m + b.y * b.m) / total;
              a.vx = (a.vx * a.m + b.vx * b.m) / total;
              a.vy = (a.vy * a.m + b.vy * b.m) / total;
              a.m = total;
              a.r = radiusFor(total);
              bodies.splice(j, 1);
              j--;
            } else {
              var overlap = min - d;
              var sum = a.m + b.m;
              a.x -= nx * overlap * (b.m / sum);
              a.y -= ny * overlap * (b.m / sum);
              b.x += nx * overlap * (a.m / sum);
              b.y += ny * overlap * (a.m / sum);

              var vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
              if (vn > 0) {
                var imp = -1.85 * vn / (1 / a.m + 1 / b.m);
                a.vx += imp * nx / a.m;
                a.vy += imp * ny / a.m;
                b.vx -= imp * nx / b.m;
                b.vy -= imp * ny / b.m;
              }
            }
          }
        }
      }

      function cull() {
        var cx = W / 2;
        var cy = H / 2;
        var limit = Math.max(W, H) * 2.5;
        bodies = bodies.filter(function (b) {
          return Math.abs(b.x - cx) < limit && Math.abs(b.y - cy) < limit;
        });
      }

      function step() {
        integrate(1 / 3);
        integrate(1 / 3);
        integrate(1 / 3);

        if (state.expansion > 0) {
          var k = 1 + state.expansion * 0.000025;
          var cx = W / 2;
          var cy = H / 2;
          for (var i = 0; i < bodies.length; i++) {
            bodies[i].x = cx + (bodies[i].x - cx) * k;
            bodies[i].y = cy + (bodies[i].y - cy) * k;
          }
        }

        collide();
        cull();
        countEl.textContent = bodies.length;
      }

      /* ---------- Rendering ---------- */

      function drawBody(b) {
        var c = colorFor(b.m);
        var r = b.r;
        var hr = Math.max(r * 3.2, r + 8);

        // Soft halo
        var halo = ctx.createRadialGradient(b.x, b.y, r * 0.3, b.x, b.y, hr);
        halo.addColorStop(0, rgba(c, 0.34));
        halo.addColorStop(0.45, rgba(c, 0.10));
        halo.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(b.x, b.y, hr, 0, TAU);
        ctx.fill();

        // Lit body
        var core = ctx.createRadialGradient(
          b.x - r * 0.3, b.y - r * 0.35, r * 0.1,
          b.x, b.y, r
        );
        core.addColorStop(0, "#ffffff");
        core.addColorStop(0.4, rgba(c, 0.98));
        core.addColorStop(1, darker(c, 0.55));
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(b.x, b.y, r, 0, TAU);
        ctx.fill();
      }

      function drawDrag() {
        var sx = drag.sx;
        var sy = drag.sy;
        var x = drag.x;
        var y = drag.y;
        var dx = x - sx;
        var dy = y - sy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var r = radiusFor(state.newMass);

        ctx.save();

        // Ghost of the body about to be launched
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, TAU);
        ctx.fillStyle = "rgba(92,225,255,0.12)";
        ctx.fill();
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(92,225,255,0.65)";
        ctx.stroke();
        ctx.setLineDash([]);

        if (dist > 5) {
          // Pull-back guide
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(sx, sy);
          ctx.setLineDash([5, 6]);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "rgba(255,107,74,0.6)";
          ctx.stroke();
          ctx.setLineDash([]);

          // Launch direction arrow
          var vx = sx - x;
          var vy = sy - y;
          var len = Math.sqrt(vx * vx + vy * vy) || 1;
          var ux = vx / len;
          var uy = vy / len;
          var arrow = Math.min(34 + dist * 0.55, 170);
          var ex = sx + ux * arrow;
          var ey = sy + uy * arrow;

          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(ex, ey);
          ctx.lineWidth = 2;
          ctx.strokeStyle = "rgba(92,225,255,0.9)";
          ctx.stroke();

          var head = 9;
          ctx.beginPath();
          ctx.moveTo(ex, ey);
          ctx.lineTo(ex - ux * head - uy * head * 0.55, ey - uy * head + ux * head * 0.55);
          ctx.lineTo(ex - ux * head + uy * head * 0.55, ey - uy * head - ux * head * 0.55);
          ctx.closePath();
          ctx.fillStyle = "rgba(92,225,255,0.9)";
          ctx.fill();

          var speed = Math.min(MAX_LAUNCH, dist * LAUNCH_POWER);
          ctx.font = "11px 'JetBrains Mono', monospace";
          ctx.fillStyle = "rgba(219,231,243,0.85)";
          ctx.fillText("v " + speed.toFixed(1), sx + r + 10, sy + 4);
        }

        ctx.restore();
      }

      function draw() {
        var trails = state.trails && !state.paused;
        ctx.fillStyle = trails ? "rgba(4,6,12,0.16)" : "#04060c";
        ctx.fillRect(0, 0, W, H);

        for (var i = 0; i < bodies.length; i++) drawBody(bodies[i]);
        if (drag) drawDrag();
      }

      /* ---------- Scenes ---------- */

      function clearAll() {
        bodies = [];
        countEl.textContent = "0";
      }

      function galaxy() {
        bodies = [];
        var cx = W / 2;
        var cy = H / 2;
        var G = G_BASE * state.G;
        var span = Math.min(W, H);
        var coreMass = 3000;

        addBody(cx, cy, 0, 0, coreMass);

        // Bodies sit on well-spaced rings: neighbours on a ring share radius
        // and speed, so they never drift into each other. Deep inside a gravity
        // well only the central mass matters, so the orbiters stay light and
        // the whole system keeps its shape.
        var rings = 6;
        var perRing = 14;
        var inner = span * 0.24;
        var outer = span * 0.48;

        for (var k = 0; k < rings; k++) {
          var r = inner + ((outer - inner) * k) / (rings - 1);
          var phase = Math.random() * TAU;
          var v = Math.sqrt((G * coreMass) / r);

          for (var i = 0; i < perRing; i++) {
            var a = phase + (i / perRing) * TAU;
            var m = 0.02 + Math.random() * 0.06;
            addBody(
              cx + Math.cos(a) * r,
              cy + Math.sin(a) * r,
              -Math.sin(a) * v,
              Math.cos(a) * v,
              m
            );
          }
        }

        countEl.textContent = bodies.length;
      }

      function binary() {
        bodies = [];
        var cx = W / 2;
        var cy = H / 2;
        var G = G_BASE * state.G;
        var span = Math.min(W, H);
        var d = span * 0.14;
        var starMass = 900;
        var v = Math.sqrt((G * starMass) / (2 * d));

        addBody(cx - d / 2, cy, 0, v, starMass);
        addBody(cx + d / 2, cy, 0, -v, starMass);

        var totalMass = starMass * 2;
        var rings = 3;
        var perRing = 14;
        // Circumbinary orbits stay calm only well outside the pair
        var inner = d * 2.5;
        var outer = d * 3.4;

        for (var k = 0; k < rings; k++) {
          var r = inner + ((outer - inner) * k) / (rings - 1);
          var phase = Math.random() * TAU;
          var vv = Math.sqrt((G * totalMass) / r);

          for (var i = 0; i < perRing; i++) {
            var a = phase + (i / perRing) * TAU;
            var m = 0.02 + Math.random() * 0.06;
            addBody(
              cx + Math.cos(a) * r,
              cy + Math.sin(a) * r,
              -Math.sin(a) * vv,
              Math.cos(a) * vv,
              m
            );
          }
        }

        countEl.textContent = bodies.length;
      }

      /* ---------- Pointer interaction ---------- */

      function canvasPoint(e) {
        var rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        var p = canvasPoint(e);
        drag = { sx: p.x, sy: p.y, x: p.x, y: p.y };
        canvas.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      window.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var p = canvasPoint(e);
        drag.x = p.x;
        drag.y = p.y;
      });

      function endDrag(e) {
        if (!drag) return;
        var p = canvasPoint(e);
        drag.x = p.x;
        drag.y = p.y;

        var dx = drag.x - drag.sx;
        var dy = drag.y - drag.sy;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (bodies.length < MAX_BODIES) {
          if (dist < 6) {
            addBody(drag.sx, drag.sy, 0, 0, state.newMass);
          } else {
            var vx = -dx * LAUNCH_POWER;
            var vy = -dy * LAUNCH_POWER;
            var speed = Math.sqrt(vx * vx + vy * vy);
            if (speed > MAX_LAUNCH) {
              vx = vx / speed * MAX_LAUNCH;
              vy = vy / speed * MAX_LAUNCH;
            }
            addBody(drag.sx, drag.sy, vx, vy, state.newMass);
          }
          countEl.textContent = bodies.length;
        }

        drag = null;
      }

      window.addEventListener("pointerup", endDrag);
      window.addEventListener("pointercancel", function () { drag = null; });

      /* ---------- Controls ---------- */

      var gRange = document.getElementById("gRange");
      var gVal = document.getElementById("gVal");
      var expRange = document.getElementById("expRange");
      var expVal = document.getElementById("expVal");
      var massRange = document.getElementById("massRange");
      var massVal = document.getElementById("massVal");
      var trailsChk = document.getElementById("trailsChk");
      var mergeChk = document.getElementById("mergeChk");
      var pauseBtn = document.getElementById("pauseBtn");
      var clearBtn = document.getElementById("clearBtn");
      var galaxyBtn = document.getElementById("galaxyBtn");
      var binaryBtn = document.getElementById("binaryBtn");

      gRange.addEventListener("input", function () {
        state.G = parseFloat(gRange.value);
        gVal.textContent = state.G.toFixed(2) + "\u00D7";
      });

      expRange.addEventListener("input", function () {
        state.expansion = parseFloat(expRange.value);
        expVal.textContent = (state.expansion / 100).toFixed(2) + "\u00D7";
      });

      massRange.addEventListener("input", function () {
        state.newMass = parseFloat(massRange.value);
        massVal.textContent = String(state.newMass);
      });

      trailsChk.addEventListener("change", function () {
        state.trails = trailsChk.checked;
      });

      mergeChk.addEventListener("change", function () {
        state.merge = mergeChk.checked;
      });

      pauseBtn.addEventListener("click", function () {
        state.paused = !state.paused;
        pauseBtn.textContent = state.paused ? "Resume" : "Pause";
        pauseBtn.classList.toggle("is-on", state.paused);
      });

      clearBtn.addEventListener("click", clearAll);
      galaxyBtn.addEventListener("click", galaxy);
      binaryBtn.addEventListener("click", binary);

      /* ---------- Main loop ---------- */

      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", resize);

      resize();
      galaxy();

      var last = 0;
      var acc = 0;
      var STEP = 1000 / 60;

      function loop(t) {
        if (!last) last = t;
        var dt = t - last;
        last = t;
        if (dt > 120) dt = 120;

        if (!state.paused) {
          acc += dt;
          var guard = 0;
          while (acc >= STEP && guard < 3) {
            step();
            acc -= STEP;
            guard++;
          }
          if (acc > STEP) acc = 0;
        } else {
          acc = 0;
        }

        draw();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
